<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me and Research Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 100vw; /* Set width to 100% of viewport width */
            background-color: #f4f4f4;
            transition: transform 0.3s ease;
            transform: translateX(-100vw); /* Initially off the screen */
            overflow-y: auto;
            position: fixed; /* Fixed position to cover the entire screen */
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 999;
        }

        .content {
            flex: 1;
            padding: 20px;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .menu-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            cursor: pointer;
            z-index: 1000; /* Make sure it's above the sidebar */
        }

        .menu-toggle span {
            display: block;
            width: 30px;
            height: 4px;
            background-color: #333;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar" id="sidebar">
            <h2 id="sidebarTitle"></h2>
            <p id="sidebarContent"></p>
        </div>
        <div class="content">
            <h1>Welcome to My Website</h1>
            <ul>
                <li><a href="#" onclick="openSidebar('About Me')">About Me</a></li>
                <li><a href="#" onclick="openSidebar('Research')">Research</a></li>
            </ul>
            <p>This is the content of my website. Feel free to explore!</p>
        </div>
    </div>
    <div class="menu-toggle" onclick="toggleSidebar()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <script>
        function toggleSidebar() {
            var sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }

        function openSidebar(title) {
            var sidebar = document.getElementById('sidebar');
            var sidebarTitle = document.getElementById('sidebarTitle');
            var sidebarContent = document.getElementById('sidebarContent');
            
            sidebarTitle.textContent = title;
            if (title === 'About Me') {
                sidebarContent.textContent = 'This is some information about me. You can add more details here.';
            } else if (title === 'Research') {
                sidebarContent.textContent = 'This is some information about my research. You can add more details here.';
            }

            sidebar.classList.add('open');
        }
    </script>
</body>
</html>
